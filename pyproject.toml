[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-file-explorer"
version = "0.1.0"
description = "A modern desktop application to browse, index, search, preview, and download Telegram files and media."
readme = "README.md"
authors = [
    { name = "Wissam", email = "36-wissam@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "telethon>=1.34.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
telegram-file-explorer = "main:main"
